<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account – Ben Ibe Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/main/site.css">
<link rel="stylesheet" href="../css/main/auth.css">
</head>
<body class="auth">
<main class="auth-wrap">
  <a class="auth-logo" href="index.html" aria-label="Ben Ibe Flowers home"><img src="../assets/logo.svg" alt="Ben Ibe Flowers" width="190" height="63"></a>
  <form class="auth-card" id="register-form" novalidate aria-label="Create an account">
    <label for="rg-first">First Name</label><div class="inp"><input id="rg-first" type="text" autocomplete="given-name" required></div><small class="err" id="rg-first-e"></small>
    <label for="rg-last">Last Name</label><div class="inp"><input id="rg-last" type="text" autocomplete="family-name" required></div><small class="err" id="rg-last-e"></small>
    <label for="rg-email">Email</label><div class="inp"><input id="rg-email" type="email" autocomplete="email" required></div><small class="err" id="rg-email-e"></small>
    <label for="rg-pass">Password</label><div class="inp"><input id="rg-pass" type="password" autocomplete="new-password" required><button type="button" class="eye" data-for="rg-pass" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></div><small class="err" id="rg-pass-e"></small>
    <label for="rg-pass2">Confirm Password</label><div class="inp"><input id="rg-pass2" type="password" autocomplete="new-password" required><button type="button" class="eye" data-for="rg-pass2" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></div><small class="err" id="rg-pass2-e"></small>
    <div class="row-end"><a href="index.html#login">Already Registered?</a><button class="dark-btn" type="submit">Submit</button></div>
    <p class="status" id="rg-status" role="status"></p>
  </form>
  <p class="demo">Demo only &ndash; no account is created. Real sign-up needs a backend.</p>
</main>
<script src="../scripts/main/auth.js"></script>
</body>
</html>
