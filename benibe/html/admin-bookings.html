<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bookings – Ben Ibe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shop/site.css">
<link rel="stylesheet" href="../css/admin/shell.css">
<link rel="stylesheet" href="../css/admin/bookings.css">
</head>
<body class="admin">
<div data-bi="sidebar" data-variant="admin" data-active="bookings"></div>

<div class="shell">
  <header class="ah">
    <button type="button" class="ah-burger" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="ah-title"><h1>BOOKINGS</h1><p id="greet">Blooming Day, Admin Name!</p></div>
    <div class="ah-tools">
      <form class="search" role="search" id="adminSearchForm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="adminSearch" type="search" placeholder="Search" aria-label="Search bookings by customer or service" autocomplete="off"></form>
      <div class="pw"><button type="button" class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="bellPop"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15z"/><path d="M10 21h4"/></svg><i class="rdot" id="bellDot" hidden></i></button>
        <div class="pop" id="bellPop" hidden><h2>Notifications</h2><ul id="bellList"><li class="muted">Loading…</li></ul></div></div>
      <div class="pw"><button type="button" class="me" id="meBtn" aria-expanded="false" aria-controls="mePop"><span class="av-w" id="avSm"><svg class="av" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#c9ccd3"/><circle cx="24" cy="19" r="8" fill="#6b7280"/><path d="M8 42c1-8 8-12 16-12s15 4 16 12a24 24 0 0 1-32 0z" fill="#6b7280"/></svg></span><span class="who"><b id="meName">Admin Name</b><small id="meRole">Administrator</small><small class="on"><i></i>Online</small></span><svg class="chev2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 9 7 7 7-7"/></svg></button>
        <div class="pop" id="mePop" hidden><a href="admin-profile.html">Profile Settings</a><a href="index.html">View storefront</a><button type="button" data-toast="Log out needs the backend (sessions).">Log out</button></div></div>
    </div>
  </header>
  <main class="am og" id="main">
    <div class="otop">
      <div class="fpills" role="group" aria-label="View"><button type="button" class="fpill" data-v="calendar" aria-pressed="true">Calendar</button><button type="button" class="fpill" data-v="list" aria-pressed="false">List</button></div>
      <div class="otools">
        <label class="tsel"><span class="sr-only">Filter by status</span><select id="fSt"><option value="">Status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="completed">Completed</option><option value="declined">Declined</option></select></label>
        <label class="tsel"><span class="sr-only">Filter by service</span><select id="fSv"><option value="">Service</option></select></label>
        <form class="idsearch" id="idForm" role="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="idQ" type="search" placeholder="Search booking ID" aria-label="Search booking ID" maxlength="12" autocomplete="off"></form>
      </div>
    </div>

    <div class="ogrid">
      <div class="lcol">
        <section class="dcard bcal" id="calCard" aria-labelledby="mH">
          <div class="bcal-h"><button type="button" id="prevM" aria-label="Previous month">‹</button><h2 id="mH" aria-live="polite"></h2><button type="button" id="nextM" aria-label="Next month">›</button></div>
          <div class="bcal-b tw"><table class="bcal-t"><thead><tr><th scope="col">Sun</th><th scope="col">Mon</th><th scope="col">Tue</th><th scope="col">Wed</th><th scope="col">Thu</th><th scope="col">Fri</th><th scope="col">Sat</th></tr></thead><tbody id="calBody"></tbody></table></div>
        </section>
        <section class="dcard" aria-labelledby="ubH">
          <h2 class="aoh" id="ubH">Upcoming bookings</h2>
          <div class="tw"><table class="dt ot"><caption class="sr-only">Bookings</caption><thead><tr><th scope="col">Booking ID</th><th scope="col">Customer</th><th scope="col">Service</th><th scope="col">Date &amp; Time</th><th scope="col">Guest / qty</th><th scope="col">Deposit</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody id="bBody" aria-live="polite"></tbody></table></div>
          <nav class="pager" id="pager" aria-label="Pagination"></nav>
          <p class="dfoot" id="allLink"><button type="button" class="vall" id="viewAllB">View all bookings →</button></p>
        </section>
      </div>
      <aside class="odetail" id="detail" aria-label="Booking details" aria-live="polite"><p class="muted-p">Select a booking to see its details.</p></aside>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="backdrop" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="x" data-close aria-label="Close">×</button><h2 id="mTitle"></h2><div id="mBody"></div><div class="m-actions" id="mActions"></div></div></div>
<script src="../scripts/components.js"></script>
<script src="../scripts/shop/common.js"></script>
<script src="../scripts/shop/api.js"></script>
<script src="../scripts/admin/shell.js"></script>
<script src="../scripts/admin/bookings.js"></script>
</body>
</html>
