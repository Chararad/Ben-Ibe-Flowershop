<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password – Ben Ibe Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/main/site.css">
<link rel="stylesheet" href="../css/main/auth.css">
</head>
<body class="auth">
<main class="auth-wrap">
  <a class="auth-logo" href="index.html" aria-label="Ben Ibe Flowers home"><img src="../assets/logo.svg" alt="Ben Ibe Flowers" width="190" height="63"></a>
  <form class="auth-card" id="reset-form" novalidate aria-label="Reset your password">
    <p class="lead">Need a new password? Type in your email and we&rsquo;ll email you a reset link.</p>
    <label for="rs-email">Email</label><div class="inp"><input id="rs-email" type="email" autocomplete="email" required></div><small class="err" id="rs-email-e"></small>
    <div class="row-end"><span class="sent" id="rs-status" role="status"></span><button class="dark-btn" type="submit">Email Password Reset Link</button></div>
  </form>
  <p class="demo">Demo only &ndash; no email is sent. Sending reset links needs a backend.</p>
</main>
<script src="../scripts/main/auth.js"></script>
</body>
</html>
