<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Profile Settings – Ben Ibe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shop/site.css">
<link rel="stylesheet" href="../css/admin/shell.css">
<link rel="stylesheet" href="../css/admin/profile.css">
</head>
<body class="admin">
<div data-bi="sidebar" data-variant="admin" data-active="profile"></div>

<div class="shell">
  <header class="ah">
    <button type="button" class="ah-burger" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="ah-title"><h1>PROFILE SETTINGS</h1><p id="greet">Blooming Day, Admin Name!</p></div>
    <div class="ah-tools">
      <form class="search" role="search" id="adminSearchForm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="adminSearch" type="search" placeholder="Search" aria-label="Search records" autocomplete="off"></form>
      <div class="pw"><button type="button" class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="bellPop"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15z"/><path d="M10 21h4"/></svg><i class="rdot" id="bellDot" hidden></i></button>
        <div class="pop" id="bellPop" hidden><h2>Notifications</h2><ul id="bellList"><li class="muted">Loading…</li></ul></div></div>
      <div class="pw"><button type="button" class="me" id="meBtn" aria-expanded="false" aria-controls="mePop"><span class="av-w" id="avSm"><svg class="av" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#c9ccd3"/><circle cx="24" cy="19" r="8" fill="#6b7280"/><path d="M8 42c1-8 8-12 16-12s15 4 16 12a24 24 0 0 1-32 0z" fill="#6b7280"/></svg></span><span class="who"><b id="meName">Admin Name</b><small id="meRole">Administrator</small><small class="on"><i></i>Online</small></span><svg class="chev2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 9 7 7 7-7"/></svg></button>
        <div class="pop" id="mePop" hidden><a href="admin-profile.html">Profile Settings</a><a href="index.html">View storefront</a><button type="button" data-toast="Log out needs the backend (sessions).">Log out</button></div></div>
    </div>
  </header>

  <main class="am" id="main">
    <div class="prof">
      <aside class="pcard" aria-label="Profile menu">
        <label class="pav" for="avatarIn" title="Change photo"><span class="av-w big" id="avBig"><svg class="av" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#c9ccd3"/><circle cx="24" cy="19" r="8" fill="#6b7280"/><path d="M8 42c1-8 8-12 16-12s15 4 16 12a24 24 0 0 1-32 0z" fill="#6b7280"/></svg></span><span class="pav-t">Change photo</span><input type="file" id="avatarIn" accept="image/*"></label>
        <div class="ptabs" role="tablist" aria-label="Profile sections">
          <button type="button" class="ptab" role="tab" id="tabP" aria-selected="true" aria-controls="panelP"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.500 3.500-7 8-7s8 2.500 8 7"/></svg>Manage Profile</button>
          <button type="button" class="ptab" role="tab" id="tabL" aria-selected="false" aria-controls="panelL" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M3 8h4M3 12h4M3 16h4M10 8h6"/></svg>Log History</button>
        </div>
      </aside>
      <div class="pbody">
        <p class="crumbs2"><a href="index.html">Homepage</a> › <span>Profile</span></p>
        <section role="tabpanel" id="panelP" aria-labelledby="tabP">
          <h2 class="mp">MANAGE PROFILE</h2>
          <form id="pform" novalidate aria-label="Manage profile"><div class="fgrid"><div class="f"><label for="firstName">First Name</label><input id="firstName" name="firstName" type="text" autocomplete="given-name" maxlength="40" aria-describedby="firstNameE"><p class="err" id="firstNameE" role="alert"></p></div><div class="f"><label for="lastName">Last Name</label><input id="lastName" name="lastName" type="text" autocomplete="family-name" maxlength="40" aria-describedby="lastNameE"><p class="err" id="lastNameE" role="alert"></p></div><div class="f"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="80" aria-describedby="emailE"><p class="err" id="emailE" role="alert"></p></div><div class="f"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" maxlength="12" aria-describedby="phoneE"><p class="err" id="phoneE" role="alert"></p></div><div class="f"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="64" aria-describedby="passwordE"><p class="err" id="passwordE" role="alert"></p></div><div class="f"><label for="password2">Confirm Password</label><input id="password2" name="password2" type="password" autocomplete="new-password" maxlength="64" aria-describedby="password2E"><p class="err" id="password2E" role="alert"></p></div></div>
            <button type="submit" class="upd" id="updBtn" disabled>Update Information</button></form>
          <section class="lcard" aria-labelledby="lh1">
            <div class="lh"><h3 id="lh1">Log History</h3><button type="button" class="vall" id="viewAll">View All Records →</button></div>
            <div class="tw"><table class="lt"><thead><tr><th scope="col">TransactionID</th><th scope="col">User</th><th scope="col">Activity time</th><th scope="col">Activity</th></tr></thead><tbody id="logRecent"></tbody></table></div>
          </section>
        </section>
        <section role="tabpanel" id="panelL" aria-labelledby="tabL" hidden>
          <h2 class="mp">LOG HISTORY</h2>
          <section class="lcard flush" aria-label="All records"><p class="lcount" id="lCount" aria-live="polite"></p><div class="tw"><table class="lt"><thead><tr><th scope="col">TransactionID</th><th scope="col">User</th><th scope="col">Activity time</th><th scope="col">Activity</th></tr></thead><tbody id="logAll"></tbody></table></div></section>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="backdrop" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="x" data-close aria-label="Close">×</button><h2 id="mTitle"></h2><div id="mBody"></div><div class="m-actions" id="mActions"></div></div></div>
<script src="../scripts/components.js"></script>
<script src="../scripts/shop/common.js"></script>
<script src="../scripts/shop/api.js"></script>
<script src="../scripts/admin/shell.js"></script>
<script src="../scripts/admin/profile.js"></script>
</body>
</html>
