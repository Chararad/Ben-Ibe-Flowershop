<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Products – Ben Ibe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shop/site.css">
<link rel="stylesheet" href="../css/admin/shell.css">
<link rel="stylesheet" href="../css/admin/products.css">
</head>
<body class="admin">
<div data-bi="sidebar" data-variant="admin" data-active="products"></div>

<div class="shell">
  <header class="ah">
    <button type="button" class="ah-burger" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="ah-title"><h1>PRODUCTS</h1><p id="greet">Blooming Day, Admin Name!</p></div>
    <div class="ah-tools">
      <form class="search" role="search" id="adminSearchForm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="adminSearch" type="search" placeholder="Search" aria-label="Search products and items" autocomplete="off"></form>
      <div class="pw"><button type="button" class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="bellPop"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15z"/><path d="M10 21h4"/></svg><i class="rdot" id="bellDot" hidden></i></button>
        <div class="pop" id="bellPop" hidden><h2>Notifications</h2><ul id="bellList"><li class="muted">Loading…</li></ul></div></div>
      <div class="pw"><button type="button" class="me" id="meBtn" aria-expanded="false" aria-controls="mePop"><span class="av-w" id="avSm"><svg class="av" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#c9ccd3"/><circle cx="24" cy="19" r="8" fill="#6b7280"/><path d="M8 42c1-8 8-12 16-12s15 4 16 12a24 24 0 0 1-32 0z" fill="#6b7280"/></svg></span><span class="who"><b id="meName">Admin Name</b><small id="meRole">Administrator</small><small class="on"><i></i>Online</small></span><svg class="chev2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 9 7 7 7-7"/></svg></button>
        <div class="pop" id="mePop" hidden><a href="admin-profile.html">Profile Settings</a><a href="index.html">View storefront</a><button type="button" data-toast="Log out needs the backend (sessions).">Log out</button></div></div>
    </div>
  </header>
  <main class="am pg" id="main">
    <div class="tbar"><label class="sr-only" for="fP">Filter products by category</label><select id="fP" class="psel fsel"><option value="">All</option><option>Fresh</option><option>Dried</option><option>Dome</option><option>Balloon</option></select><span class="cnt" id="cntP" aria-live="polite"></span></div>
    <section class="dcard" aria-labelledby="apH">
      <div class="dh"><h2 id="apH">Add product</h2><span class="acts"><button type="button" class="addb" id="addP">+ New product</button><button type="button" class="vall" id="vallP">View All Products →</button></span></div>
      <div class="tw"><table class="dt pt"><caption class="sr-only">Products</caption><thead><tr><th scope="col">Product ID</th><th scope="col">Product Name</th><th scope="col">Stock</th><th scope="col">Size/Dimension</th><th scope="col">Price</th><th scope="col">Category</th><th scope="col">Type</th><th scope="col">Photo</th><th scope="col">Description</th><th scope="col" class="ctr">Edit</th><th scope="col" class="ctr">Delete</th></tr></thead><tbody id="pBody"></tbody></table></div>
    </section>

    <div class="tbar second"><label class="sr-only" for="fI">Filter items by category</label><select id="fI" class="psel fsel"><option value="">All</option><option>Fresh</option><option>Dried</option><option>Dome</option><option>Balloon</option></select><span class="cnt" id="cntI" aria-live="polite"></span></div>
    <section class="dcard card2" aria-labelledby="rsH">
      <div class="dh"><h2 id="rsH">Restock</h2><span class="acts"><button type="button" class="addb" id="addI">+ New item</button><button type="button" class="vall" id="vallI">View All Items →</button></span></div>
      <div class="tw"><table class="dt it"><caption class="sr-only">Flower inventory</caption><thead><tr><th scope="col">Item ID</th><th scope="col">Type</th><th scope="col">Stems</th><th scope="col">Category</th><th scope="col">Photo</th><th scope="col" class="ctr">Edit</th><th scope="col" class="ctr">Delete</th></tr></thead><tbody id="iBody"></tbody></table></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="backdrop" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="x" data-close aria-label="Close">×</button><h2 id="mTitle"></h2><div id="mBody"></div><div class="m-actions" id="mActions"></div></div></div>
<script src="../scripts/components.js"></script>
<script src="../scripts/shop/common.js"></script>
<script src="../scripts/shop/api.js"></script>
<script src="../scripts/admin/shell.js"></script>
<script src="../scripts/admin/products.js"></script>
</body>
</html>
