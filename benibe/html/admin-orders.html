<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orders – Ben Ibe Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shop/site.css">
<link rel="stylesheet" href="../css/admin/shell.css">
<link rel="stylesheet" href="../css/admin/orders.css">
</head>
<body class="admin">
<div data-bi="sidebar" data-variant="admin" data-active="orders"></div>

<div class="shell">
  <header class="ah">
    <button type="button" class="ah-burger" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="ah-title"><h1>ORDERS</h1><p id="greet">Blooming Day, Admin Name!</p></div>
    <div class="ah-tools">
      <form class="search" role="search" id="adminSearchForm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="adminSearch" type="search" placeholder="Search" aria-label="Search orders by customer or product" autocomplete="off"></form>
      <div class="pw"><button type="button" class="bell" id="bellBtn" aria-label="Notifications" aria-expanded="false" aria-controls="bellPop"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15z"/><path d="M10 21h4"/></svg><i class="rdot" id="bellDot" hidden></i></button>
        <div class="pop" id="bellPop" hidden><h2>Notifications</h2><ul id="bellList"><li class="muted">Loading…</li></ul></div></div>
      <div class="pw"><button type="button" class="me" id="meBtn" aria-expanded="false" aria-controls="mePop"><span class="av-w" id="avSm"><svg class="av" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#c9ccd3"/><circle cx="24" cy="19" r="8" fill="#6b7280"/><path d="M8 42c1-8 8-12 16-12s15 4 16 12a24 24 0 0 1-32 0z" fill="#6b7280"/></svg></span><span class="who"><b id="meName">Admin Name</b><small id="meRole">Administrator</small><small class="on"><i></i>Online</small></span><svg class="chev2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 9 7 7 7-7"/></svg></button>
        <div class="pop" id="mePop" hidden><a href="admin-profile.html">Profile Settings</a><a href="index.html">View storefront</a><button type="button" data-toast="Log out needs the backend (sessions).">Log out</button></div></div>
    </div>
  </header>
  <main class="am og" id="main">
    <div class="otop">
      <div class="fpills" id="pills" role="group" aria-label="Filter orders by status"></div>
      <div class="otools">
        <div class="pw">
          <button type="button" class="tbtn" id="drBtn" aria-expanded="false" aria-controls="drPop"><span id="drLabel">Date Range</span><svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m1 1 4 4 4-4"/></svg></button>
          <div class="pop dr" id="drPop" hidden>
            <fieldset><legend>Delivery date</legend>
              <label><input type="radio" name="dr" value="all" checked> All dates</label>
              <label><input type="radio" name="dr" value="today"> Today</label>
              <label><input type="radio" name="dr" value="week"> This week</label>
              <label><input type="radio" name="dr" value="month"> This month</label>
              <label><input type="radio" name="dr" value="next30"> Next 30 days</label>
              <label><input type="radio" name="dr" value="custom"> Custom range</label>
            </fieldset>
            <div class="dr-c" id="drCustom" hidden><label>From <input type="date" id="drFrom"></label><label>To <input type="date" id="drTo"></label><p class="err" id="drErr" role="alert"></p></div>
            <div class="dr-a"><button type="button" class="pbtn ghost" id="drClear">Clear</button><button type="button" class="pbtn dark" id="drApply">Apply</button></div>
          </div>
        </div>
        <form class="idsearch" id="idForm" role="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="idQ" type="search" placeholder="Search order ID" aria-label="Search order ID" maxlength="12" autocomplete="off"></form>
      </div>
    </div>

    <div class="ogrid">
      <section class="dcard" aria-labelledby="aoH">
        <h2 class="aoh" id="aoH">All Orders</h2>
        <div class="tw"><table class="dt ot"><caption class="sr-only">Orders</caption><thead><tr><th scope="col">Order ID</th><th scope="col">Customer</th><th scope="col">Product</th><th scope="col">Amount</th><th scope="col">Payment</th><th scope="col">Delivery Date</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead><tbody id="oBody" aria-live="polite"></tbody></table></div>
        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
      <aside class="odetail" id="detail" aria-label="Order details" aria-live="polite"><p class="muted-p">Select an order to see its details.</p></aside>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="backdrop" data-close></div><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle"><button class="x" data-close aria-label="Close">×</button><h2 id="mTitle"></h2><div id="mBody"></div><div class="m-actions" id="mActions"></div></div></div>
<script src="../scripts/components.js"></script>
<script src="../scripts/shop/common.js"></script>
<script src="../scripts/shop/api.js"></script>
<script src="../scripts/admin/shell.js"></script>
<script src="../scripts/admin/orders.js"></script>
</body>
</html>
